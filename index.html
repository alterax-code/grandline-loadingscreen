<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Grand Line RP</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#02101c;}
body{background:#02101c url('assets/grandline.jpg') center center/cover no-repeat;}
</style>
</head>
<body>
<!-- Musique de fond : jouée tant que l'écran de chargement est affiché.
     GMod ferme cette page à l'entrée en jeu, la musique s'arrête avec elle,
     juste avant l'écran de sélection. Deux formats : l'ancien navigateur de
     GMod ne lit que l'ogg, le nouveau (branche 64 bits) lit les deux. -->
<audio id="musique" loop preload="auto">
  <source src="assets/musique.ogg" type="audio/ogg">
  <source src="assets/musique.mp3" type="audio/mpeg">
</audio>
<script>
// Volume final (0 à 1) et durée du fondu d'entrée (ms) : pas trop fort,
// le joueur règle le son de son jeu, pas celui de cette page.
var VOLUME = 0.15, FONDU = 3000;
var a = document.getElementById('musique');
a.volume = 0;
function monte() {
  var t0 = Date.now();
  (function pas() {
    var k = Math.min(1, (Date.now() - t0) / FONDU);
    a.volume = VOLUME * k;
    if (k < 1) setTimeout(pas, 50);
  })();
}
var p = a.play();
if (p && p.then) { p.then(monte, function () {}); } else { monte(); }
</script>
</body>
</html>
