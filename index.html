<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Grand Line RP</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#02101c;}
body{background:#02101c url('assets/grandline.jpg') center center/cover no-repeat;}
</style>
</head>
<body>
<!-- Musique de fond. GMod ferme cette page à la fin du chargement : le jeu
     (addon oprp_core, character/cl_joinmusic.lua) reprend alors LA MÊME
     musique AU MÊME ENDROIT, jusqu'à l'entrée en jeu. Les deux se calent sur
     l'horloge : position = secondes depuis 1970, modulo la durée du morceau.
     Le volume est réglé DANS le fichier (−29 LUFS) : la page de GMod ne tient
     pas toujours compte du volume demandé en JavaScript. Deux formats :
     l'ancien navigateur de GMod ne lit que l'ogg. -->
<audio id="musique" loop preload="auto">
  <source src="assets/musique.ogg?v=2" type="audio/ogg">
  <source src="assets/musique.mp3?v=2" type="audio/mpeg">
</audio>
<script>
var FONDU = 2000;   // ms du fondu d'entrée
var a = document.getElementById('musique');
a.volume = 0;
function monte() {
  var t0 = Date.now();
  (function pas() {
    var k = Math.min(1, (Date.now() - t0) / FONDU);
    a.volume = k;
    if (k < 1) setTimeout(pas, 50);
  })();
}
function cale() {
  if (a.duration > 0 && isFinite(a.duration)) {
    try { a.currentTime = (Date.now() / 1000) % a.duration; } catch (e) {}
  }
}
a.addEventListener('loadedmetadata', cale);
var p = a.play();
if (p && p.then) { p.then(monte, function () {}); } else { monte(); }
</script>
</body>
</html>
